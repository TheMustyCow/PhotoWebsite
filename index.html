<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" type="text/css" href="style.css">
        
    </head>
    
    <body>
        <h1>
            <span style="color:rgb(148, 148, 148)">Thomas Weaver Photography</span>
        </h1>

        <p>
            <span style="color:rgb(148, 148, 148)">Enjoy the following photos</span>
        </p>

    <div class="gallery">
        <!-- Each div is a new photo -->
        <div class="section">
            <h2><span style="color:rgb(148, 148, 148)">Arizona Plane</span></h2>
            <img src="photos/plane.jpg" alt="Description of Image 1" class="photo">
        </div>

        <div class="section">
            <h2><span style="color:rgb(148, 148, 148)">Phoenix Sunrise</span></h2>
            <img src="photos/sunrisePhoto.jpg" alt="Description of Image 3" class="photo">
        </div>
        
        <div class="section">
            <h2><span style="color:rgb(148, 148, 148)">Bryce Canyon</span></h2>
            <img src="photos/bryceCan.jpg" alt="Description of Image 2" class="photo">
        </div>

        <div class="section">
            <h2><span style="color:rgb(148, 148, 148)">Arizona trees</span></h2>
            <img src="photos/palmTree.jpg" alt="Description of Image 4" class="photo">
        </div>

        <div class="section">
            <h2><span style="color:rgb(148, 148, 148)">Priest Drone</span></h2>
            <img src="photos/droneLake.jpg" alt="Description of Image 5" class="photo">
        </div>

        <div class="section">
            <h2><span style="color:rgb(148, 148, 148)">Cloudy Sunrise</span></h2>
            <img src="photos/indianHike.jpg" alt="Description of Image 6" class="photo">
        </div>
    </div>

</body>
</html>
